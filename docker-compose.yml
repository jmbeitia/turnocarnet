services:
  turnocarnet:
    build: .
    restart: unless-stopped
    volumes:
      - ./.env:/app/.env:ro
      - ./data:/app/data
    environment:
      - STATE_FILE=data/state.json
      - TZ=America/Argentina/Buenos_Aires
    # Chequea cada 15 minutos; si falla una corrida, sigue con la próxima
    command: sh -c "while true; do node check.js; sleep 900; done"
